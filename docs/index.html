<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking Disqus — RPGuaxa &amp; Guaxaverso</title>
  <meta name="description" content="Estatísticas de comentários, autores, episódios e palavras mais usadas nos podcasts RPGuaxa e Guaxaverso (Portal Deviante).">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">Ranking Disqus</p>
      <h1 id="page-title">RPGuaxa &amp; Guaxaverso</h1>
      <p class="subtitle" id="page-subtitle">Carregando estatísticas…</p>
    </div>
  </header>

  <nav class="tabs-wrap" aria-label="Selecionar podcast">
    <div class="wrap">
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
  </nav>

  <main class="wrap" id="shows" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-meta"></p>
      <p>
        Dados coletados da API do Disqus e gerados com
        <code>dotnet run --project src/DisqusAnalytics.Console stats</code>.
        <a href="statistics.json" download>Baixar o JSON</a>.
      </p>
    </div>
  </footer>

  <noscript>
    <p class="wrap message">Ative o JavaScript para visualizar as estatísticas.</p>
  </noscript>

  <template id="error-template">
    <div class="message">
      <h2>Não foi possível carregar as estatísticas</h2>
      <p class="message-detail"></p>
      <p>
        Quando a página é aberta direto do disco (<code>file://</code>),
        o navegador bloqueia a leitura do JSON. Rode
        <code>dotnet run --project src/DisqusAnalytics.Console stats</code>
        para gerar <code>statistics.js</code> ao lado desta página, ou sirva
        a pasta com um servidor local, por exemplo:
      </p>
      <p>E acesse <code>http://localhost:8000</code>.</p>
    </div>
  </template>

  <!-- Dados embutidos: permite abrir o arquivo direto do disco (file://). -->
  <script src="statistics.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
